<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payout System Dashboard —/title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #020812;
            min-height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: auto;
        }

        .dashboard {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .dashboard img {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: auto;
        }

        /* Mobile */
        @media (max-width: 700px) {
            body {
                justify-content: flex-start;
            }

            .dashboard {
                width: 100%;
                min-width: 900px;
            }
        }
    </style>
</head>

<body>

    <main class="dashboard">
        <img
            src="dashboard.png"
            alt="Payout System dashboard"
        >
    </main>

</body>
</html>
